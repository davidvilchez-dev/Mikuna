name: Mikuna backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: mikuna-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # Las pruebas de integración usan PostgreSQL real (mikuna_test_db), igual que en local. Flyway crea el
    # esquema desde las migraciones al arrancar cada contexto de prueba; Stripe, Cloudinary y Gemini van con dobles.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mikuna_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mikuna_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis (spec 015): solo para las pruebas marcadas con MIKUNA_TEST_REDIS; el resto usa caché en memoria.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MIKUNA_TEST_REDIS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Build, unit and integration tests
        # mvnw no tiene el bit de ejecución en el repositorio: se invoca con sh.
        run: sh ./mvnw -B -ntp verify
      - name: Test and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-evidence-${{ github.sha }}
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
