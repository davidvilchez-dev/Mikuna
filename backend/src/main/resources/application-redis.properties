# Perfil "redis" (spec 015): caché y contadores compartidos entre instancias. Se activa con
# SPRING_PROFILES_ACTIVE=redis. Pasar a un Redis gestionado es cambiar estas variables; sin TLS en local.
spring.cache.type=redis
# Dos niveles: Caffeine local (lecturas en memoria) delante de Redis. Los descartes se avisan por pub/sub; la vida
# local corta es solo un respaldo si un aviso se pierde.
mikuna.cache.local-ttl=${MIKUNA_CACHE_LOCAL_TTL:PT1M}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Tiempos cortos: si Redis cae, cada petición espera poco antes de leer de la base de datos.
spring.data.redis.timeout=250ms
spring.data.redis.connect-timeout=500ms
management.health.redis.enabled=true
