spring.application.name=backend

# Variables locales desde backend/.env (no versionado; plantilla en backend/.env.example).
# La segunda ruta permite ejecutar desde la raiz del repositorio (IDE).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mikuna_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false

# Seguridad: JWT firmado con HS256 (secreto en backend/.env, minimo 32 bytes)
mikuna.security.jwt.secret=${MIKUNA_JWT_SECRET}
mikuna.security.jwt.expiration=${MIKUNA_JWT_EXPIRATION:PT2H}

# API: rechazar campos desconocidos y responder errores como ProblemDetail
spring.jackson.deserialization.fail-on-unknown-properties=true
# Enteros estrictos: 1.5 no se acepta como 1 (cantidades del carrito)
spring.jackson.deserialization.accept-float-as-int=false
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health

# Zona horaria de la plataforma (horarios de atencion de restaurantes)
mikuna.timezone=${MIKUNA_TIMEZONE:America/Lima}

# Catalogo (spec 004): imagenes de productos en Cloudinary. Las credenciales
# cloudinary.cloud-name, cloudinary.api-key y cloudinary.api-secret van en backend/.env.
cloudinary.folder=mikuna/products
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Carrito y direcciones (spec 005): reglas de negocio acordadas con el usuario, sin valores por defecto.
# Distritos cubiertos (separados por comas), tarifa fija de envio (soles) y comision (% del subtotal)
# se definen en backend/.env.
mikuna.delivery.districts=${MIKUNA_DELIVERY_DISTRICTS}
mikuna.delivery.fee=${MIKUNA_DELIVERY_FEE}
mikuna.delivery.commission-rate=${MIKUNA_COMMISSION_RATE}

# Pedidos y pagos (spec 006): Stripe solo en modo de pruebas. Las claves van en backend/.env
# (STRIPE_SECRET_KEY empieza con sk_test_ y STRIPE_PUBLISHABLE_KEY con pk_test_); sin ellas el arranque falla.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
mikuna.payments.currency=${MIKUNA_PAYMENTS_CURRENCY:pen}
stripe.currency=${mikuna.payments.currency}

# Vencimiento de pedidos pendientes (spec 012): plazo para que el restaurante responda, fijado en cada
# pedido al crearlo, e intervalo del barrido que cancela los vencidos (debe ser menor a 1 minuto).
mikuna.orders.response-timeout=${MIKUNA_ORDER_RESPONSE_TIMEOUT:PT15M}
mikuna.orders.expiry-sweep=${MIKUNA_ORDER_EXPIRY_SWEEP:PT15S}
mikuna.orders.expiry-initial-delay=PT5S

# Asistente de IA (spec 013): Gemini en plan gratuito. La clave va solo en backend/.env (GEMINI_API_KEY); sin ella
# la aplicacion arranca y el chat responde que no esta disponible. El modelo es configurable.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
mikuna.assistant.rate-limit-per-minute=${MIKUNA_ASSISTANT_RATE_LIMIT:10}
mikuna.assistant.max-message-length=${MIKUNA_ASSISTANT_MAX_LENGTH:500}
