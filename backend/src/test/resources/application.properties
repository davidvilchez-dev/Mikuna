spring.application.name=backend

# Este archivo sustituye al principal durante las pruebas.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/mikuna_test_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Igual que en ejecucion: esquema por migraciones Flyway y Hibernate solo valida. FlywayTestConfig limpia
# el esquema y aplica todas las migraciones al arrancar cada contexto de prueba.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=false
spring.jpa.open-in-view=false

# Secreto fijo solo para pruebas locales (no es el secreto real)
mikuna.security.jwt.secret=test-secret-solo-para-pruebas-locales-32b+
mikuna.security.jwt.expiration=PT2H
# Todas las peticiones de MockMvc salen de la misma IP: el limite por IP es alto; el de cuenta, el real.
mikuna.security.login.max-failures-per-account=5
mikuna.security.login.max-failures-per-ip=1000
mikuna.security.login.window=PT15M

spring.jackson.deserialization.fail-on-unknown-properties=true
# Enteros estrictos: 1.5 no se acepta como 1 (cantidades del carrito)
spring.jackson.deserialization.accept-float-as-int=false
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,metrics
management.health.redis.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Caché (spec 015): igual que en ejecución. Las pruebas con Redis real activan el perfil "redis".
spring.cache.type=caffeine
# Redis solo se usa como caché y contador; los repositorios son JPA.
spring.data.redis.repositories.enabled=false
spring.cache.cache-names=public-restaurants,public-catalog
mikuna.cache.ttl=PT10M

mikuna.timezone=America/Lima

# Catalogo (spec 004): las pruebas sustituyen el cliente de Cloudinary por un mock.
cloudinary.folder=mikuna/products
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Carrito y direcciones (spec 005): valores solo de prueba
mikuna.delivery.districts=Ayacucho,San Juan Bautista,Carmen Alto
mikuna.delivery.fee=5.00
mikuna.delivery.commission-rate=5

# Pedidos y pagos (spec 006): claves ficticias; las pruebas sustituyen StripeGateway por un mock.
stripe.secret-key=sk_test_ficticia_solo_pruebas
stripe.publishable-key=pk_test_ficticia_solo_pruebas
mikuna.payments.currency=pen
stripe.currency=${mikuna.payments.currency}

# Vencimiento de pedidos pendientes (spec 012): en pruebas el barrido nunca corre solo; se invoca a mano.
mikuna.orders.response-timeout=PT15M
mikuna.orders.expiry-sweep=PT1H
mikuna.orders.expiry-initial-delay=PT1H

# Asistente de IA (spec 013): sin clave en pruebas; las pruebas sustituyen AssistantModel por un mock.
gemini.api-key=
gemini.model=test-model
mikuna.assistant.rate-limit-per-minute=10
mikuna.assistant.max-message-length=500
